name: GOUP Calculator Checks

on:
  push:
    branches:
      - main
      - ci/html-js-checks

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: HTML and JavaScript Check
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v6

      - name: HTMLとJavaScriptをチェック
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile
          import sys

          html_file = Path("index.html")

          if not html_file.is_file():
              print("ERROR: index.html が見つかりません")
              sys.exit(1)

          html = html_file.read_text(encoding="utf-8")

          if not html.lstrip().lower().startswith("<!doctype html>"):
              print("ERROR: HTMLのDOCTYPE宣言が見つかりません")
              sys.exit(1)

          if "</html>" not in html.lower():
              print("ERROR: </html> が見つかりません")
              sys.exit(1)

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.ids = set()
                  self.duplicate_ids = set()
                  self.scripts = []
                  self.in_script = False
                  self.external_script = False
                  self.current_script = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  element_id = attrs.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.duplicate_ids.add(element_id)
                      self.ids.add(element_id)

                  if tag.lower() == "script":
                      self.in_script = True
                      self.external_script = "src" in attrs
                      self.current_script = []

              def handle_data(self, data):
                  if self.in_script and not self.external_script:
                      self.current_script.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external_script:
                          code = "".join(self.current_script)
                          if code.strip():
                              self.scripts.append(code)

                      self.in_script = False
                      self.external_script = False
                      self.current_script = []

          parser = PageParser()
          parser.feed(html)
          parser.close()

          if parser.duplicate_ids:
              print("ERROR: 重複したHTML idが見つかりました")
              for element_id in sorted(parser.duplicate_ids):
                  print(f"  - {element_id}")
              sys.exit(1)

          print("HTMLの基本チェック: OK")
          print("重複IDチェック: OK")
          print(f"インラインJavaScript: {len(parser.scripts)}個")

          with tempfile.TemporaryDirectory() as temp_dir:
              for index, code in enumerate(parser.scripts, start=1):
                  js_file = Path(temp_dir) / f"script_{index}.js"
                  js_file.write_text(code, encoding="utf-8")

                  result = subprocess.run(
                      ["node", "--check", str(js_file)],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode != 0:
                      print(f"ERROR: JavaScript {index} に構文エラーがあります")
                      print(result.stdout)
                      print(result.stderr)
                      sys.exit(1)

          print("JavaScript構文チェック: OK")
          print("すべてのチェックに成功しました！")
          PY
