<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOUP 貯蓄時間計算機</title>
<style>
  :root { color-scheme: dark; --bg:#10141d; --panel:#1a2230; --line:#344155; --text:#f3f6fb; --muted:#aab6c8; --accent:#72a7ff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 14px 40px; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(160deg,#10141d,#17243a); color:var(--text); }
  main { max-width:620px; margin:0 auto; }
  header { text-align:center; margin:10px 0 24px; }
  h1 { margin:0 0 8px; font-size:clamp(1.55rem,5vw,2.1rem); }
  header p { margin:0; color:var(--muted); }
  .card { background:rgba(26,34,48,.96); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 12px 35px #0003; }
  .field { margin:0 0 17px; }
  label { display:block; margin-bottom:7px; font-weight:650; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) 112px; gap:9px; }
  input, select, button { width:100%; min-height:46px; border-radius:10px; border:1px solid var(--line); background:#111722; color:var(--text); padding:10px 12px; font:inherit; }
  input::placeholder { color:#748197; }
  .hint { color:var(--muted); font-size:.86rem; margin-top:6px; }
  button { cursor:pointer; font-weight:750; border:0; background:var(--accent); color:#0b1423; margin-top:4px; }
  button:hover { filter:brightness(1.08); }
  .result { margin-top:18px; border:1px solid #466a9e; background:#15243a; border-radius:14px; padding:17px; display:none; }
  .result.show { display:block; }
  .result h2 { font-size:1.1rem; margin:0 0 10px; }
  .big { font-size:clamp(1.45rem,6vw,2rem); font-weight:800; line-height:1.35; overflow-wrap:anywhere; }
  .sub { color:#c2d2e9; margin-top:7px; line-height:1.6; }
 .detail-remaining { font-size:1.1rem; font-weight:650; }
.detail-arrival { font-size:1.8rem; font-weight:650; color:#c1d7a2; }
.detail-note { font-size:1.8rem; opacity:.9; font-weight:650; color:#c1d7a2; }
  .error { color:#ffb8b8; margin-top:12px; }
  footer { color:var(--muted); font-size:.82rem; line-height:1.6; margin:17px 4px 0; }
  @media (max-width:420px) { .card { padding:15px; } .row { grid-template-columns:minmax(0,1fr) 100px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎮 GOUP 貯蓄時間計算機</h1>
    <p>収入速度と目標金額から、到達までの時間を計算！</p>
  </header>
  <section class="card" aria-label="計算フォーム">
    <div class="field">
      <label for="rate">収入速度（1秒あたり）</label>
      <div class="row">
        <input id="rate" type="number" min="0" step="any" placeholder="例：1" inputmode="decimal">
        <select id="rateUnit" aria-label="収入速度の単位">
          <option>Sx</option><option>Sp</option><option>Oc</option><option>No</option><option>Qi</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="current">現在の所持金（空欄なら0から計算）</label>
      <div class="row">
        <input id="current" type="number" min="0" step="any" placeholder="例：30（空欄でもOK）" inputmode="decimal">
        <select id="currentUnit" aria-label="所持金の単位">
          <option>Sp</option><option>Sx</option><option>Oc</option><option>No</option><option>Qi</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="target">目標金額</label>
      <div class="row">
        <input id="target" type="number" min="0" step="any" placeholder="例：10" inputmode="decimal">
        <select id="targetUnit" aria-label="目標金額の単位">
          <option>Sp</option><option>Oc</option><option>Sx</option><option>No</option><option>Qi</option>
        </select>
      </div>
    </div>
    <button id="calculate" type="button">計算する</button>
    <div id="error" class="error" role="alert"></div>
    <section id="result" class="result" aria-live="polite">
      <h2>計算結果</h2>
      <div id="duration" class="big"></div>
      <div id="detail" class="sub"></div>
    </section>
  </section>
  <footer>
    ※ Qi → Sx → Sp → Oc → No は、各段階を1000倍として計算します。<br>
    ※ ゲーム内の単位表記や収入速度が変化する場合、結果と実際の進行に差が出ることがあります。収入速度が一定である前提の計算です。
  </footer>
</main>
<script>
const exponent = { Qi: 18, Sx: 21, Sp: 24, Oc: 27, No: 30 };
const $ = id => document.getElementById(id);
function formatDuration(seconds) {
  if (!Number.isFinite(seconds)) return "計算できません";
  let s = Math.max(0, Math.floor(seconds));
  const days = Math.floor(s / 86400); s %= 86400;
  const hours = Math.floor(s / 3600); s %= 3600;
  const minutes = Math.floor(s / 60); s %= 60;
  const parts = [];
  if (days) parts.push(`${days}日`);
  if (hours || days) parts.push(`${hours}時間`);
  if (minutes || hours || days) parts.push(`${minutes}分`);
  parts.push(`${s}秒`);
  return parts.join(" ");
}
function valueInBase(number, unit) {
  return number * Math.pow(10, exponent[unit]);
}
function calculate() {
  $("error").textContent = "";
  $("result").classList.remove("show");
  const rate = Number($("rate").value);
  const currentText = $("current").value.trim();
  const current = currentText === "" ? 0 : Number(currentText);
  const target = Number($("target").value);
  const rateUnit = $("rateUnit").value;
  const currentUnit = $("currentUnit").value;
  const targetUnit = $("targetUnit").value;
  if ($("rate").value.trim() === "" || $("target").value.trim() === "" ||
      !Number.isFinite(rate) || rate <= 0 || !Number.isFinite(current) || current < 0 ||
      !Number.isFinite(target) || target <= 0) {
    $("error").textContent = "収入速度は0より大きく、所持金は0以上、目標金額は0より大きい数を入力してね。";
    return;
  }
  const remaining = valueInBase(target, targetUnit) - valueInBase(current, currentUnit);
  if (remaining <= 0) {
    $("result").classList.add("show");
    $("duration").textContent = "もう目標達成！ 🎉";
    $("detail").textContent = "現在の所持金が目標金額以上だよ。";
    return;
  }
  const perSecond = valueInBase(rate, rateUnit);
  const seconds = remaining / perSecond;
  if (!Number.isFinite(seconds) || seconds > 1e15) {
    $("error").textContent = "数値が大きすぎて計算できません。入力を確認してね。";
    return;
  }
  const now = new Date();
  const arrival = new Date(now.getTime() + seconds * 1000);
  const fmt = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit",
    weekday:"short", hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"
  });
     const remainingDisplay = remaining / Math.pow(10, exponent[targetUnit]);
  const digits = remainingDisplay < 10 ? 2 : 1;
  const formattedRemaining = new Intl.NumberFormat("ja-JP", {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  }).format(remainingDisplay);
  $("detail").innerHTML =
    `<span class="detail-remaining">必要な残り金額：約 ${formattedRemaining} ${targetUnit}</span><br>` +
    `<span class="detail-arrival">到達予定（日本時間）：${fmt.format(arrival)}</span><br>` +
    `<span class="detail-note">計算開始：${fmt.format(now)}</span>`;
  $("result").classList.add("show");
}

$("calculate").addEventListener("click", calculate);
</script>
</body>
</html>
