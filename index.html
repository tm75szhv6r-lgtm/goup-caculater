   * 400レベルを埋めるため、未確認のレベルは

   *
   * 補間値は実測値ではないので、画面に推定値と表示する。
   */
  const LEVEL_MULTIPLIERS = {};
  const ESTIMATED_LEVELS = new Set();

  const knownLevels = Object.keys(MEASURED_LEVEL_MULTIPLIERS)
    .map(Number)
    .sort((a, b) => a - b);

  for (let level = 1; level <= 400; level++) {
    if (
      Object.prototype.hasOwnProperty.call(
        MEASURED_LEVEL_MULTIPLIERS,
        String(level)
      )
    ) {
      LEVEL_MULTIPLIERS[level] =
        MEASURED_LEVEL_MULTIPLIERS[level];
      continue;
    }

    let lowerLevel = null;
    let upperLevel = null;

    for (const knownLevel of knownLevels) {
      if (knownLevel < level) lowerLevel = knownLevel;
      if (knownLevel > level) {
        upperLevel = knownLevel;
        break;
      }
    }

    let estimatedValue;

    if (lowerLevel !== null && upperLevel !== null) {
      const lowValue = MEASURED_LEVEL_MULTIPLIERS[lowerLevel];
      const highValue = MEASURED_LEVEL_MULTIPLIERS[upperLevel];

      const fraction =
        (level - lowerLevel) / (upperLevel - lowerLevel);

      estimatedValue =
        lowValue * Math.pow(highValue / lowValue, fraction);
    } else if (upperLevel !== null) {
      const nextLevel = knownLevels.find(
        value => value > upperLevel
      );

      if (nextLevel !== undefined) {
        const ratio = Math.pow(
          MEASURED_LEVEL_MULTIPLIERS[nextLevel] /
            MEASURED_LEVEL_MULTIPLIERS[upperLevel],
          1 / (nextLevel - upperLevel)
        );

        estimatedValue =
          MEASURED_LEVEL_MULTIPLIERS[upperLevel] /
          Math.pow(ratio, upperLevel - level);
      } else {
        estimatedValue =
          MEASURED_LEVEL_MULTIPLIERS[upperLevel];
      }
    } else if (lowerLevel !== null) {
      const previousLevel = [...knownLevels]
        .reverse()
        .find(value => value < lowerLevel);

      if (previousLevel !== undefined) {
        const ratio = Math.pow(
          MEASURED_LEVEL_MULTIPLIERS[lowerLevel] /
            MEASURED_LEVEL_MULTIPLIERS[previousLevel],
          1 / (lowerLevel - previousLevel)
        );

        estimatedValue =
          MEASURED_LEVEL_MULTIPLIERS[lowerLevel] *
          Math.pow(ratio, level - lowerLevel);
      } else {
        estimatedValue =
          MEASURED_LEVEL_MULTIPLIERS[lowerLevel];
      }
    } else {
      estimatedValue = 1;
    }

    LEVEL_MULTIPLIERS[level] = estimatedValue;
    ESTIMATED_LEVELS.add(level);
  }

  }

  levelSelect.value = "1";

  // ================================================
  // 8. 倍率の状態表示
  // ================================================

  function formatMultiplier(value) {
    return value.toLocaleString("ja-JP", {
      maximumFractionDigits: 10
    });
  }

  function updateLevelMultiplier(resetValue) {
    const level = Number(levelSelect.value);
    const value = LEVEL_MULTIPLIERS[level];
    const estimated = ESTIMATED_LEVELS.has(level);

    if (resetValue) {
      levelMultiplierInput.value = String(value);
    }

    if (estimated) {
      status.innerHTML =
        "<strong>推定値：</strong> レベル " + level +
        " の倍率は約 " + formatMultiplier(value) +
        " 倍です。前後の実測値から補間した値なので、" +
        "ゲーム内で確認できた正確な倍率があれば入力欄を修正してください。";
    } else {
      status.innerHTML =
        "<strong>実測データ：</strong> レベル " + level +
        " の倍率は " + formatMultiplier(value) +
        " 倍です。";
    }
  }

  characterSelect.addEventListener("change", () => {
    const index = characterSelect.value;

    if (index === "") return;

    const character = CHARACTERS[Number(index)];

    if (!character) return;

    document.getElementById("levelCharacterName").value =
      character.name;

    document.getElementById("levelBaseIncome").value =
      String(character.income);

    document.getElementById("levelBaseUnit").value =
      character.unit;
  });

  levelSelect.addEventListener("change", () => {
    updateLevelMultiplier(true);
  });

  // ================================================
  // 9. 数値と単位の表示
  // ================================================

  const unitPower = {
    "1": 0,
    K: 1,
    M: 2,
    B: 3,
    T: 4,
    Qa: 5,
    Qi: 6,
    Sx: 7,
    Sp: 8,
    Oc: 9,
    No: 10
  };

  function formatIncome(value) {
    if (!Number.isFinite(value)) {
      return "計算範囲外";
    }

    if (value === 0) {
      return "0/s";
    }

    const units = [
      ["No", 10],
      ["Oc", 9],
      ["Sp", 8],
      ["Sx", 7],
      ["Qi", 6],
      ["Qa", 5],
      ["T", 4],
      ["B", 3],
      ["M", 2],
      ["K", 1]
    ];

    for (const [unit, power] of units) {
      const scale = Math.pow(1000, power);

      if (Math.abs(value) >= scale) {
        return (
          value / scale
        ).toLocaleString("ja-JP", {
          maximumFractionDigits: 6
        }) + " " + unit + "/s";
      }
    }

    return value.toLocaleString("ja-JP", {
      maximumFractionDigits: 8
    }) + "/s";
  }

  function addResultItem(parent, label, value, finalItem) {
    const box = document.createElement("div");

    box.className =
      "level-income-result-item" +
      (finalItem ? " final" : "");

    const labelNode = document.createElement("span");
    labelNode.className = "label";
    labelNode.textContent = label;

    const valueNode = document.createElement("span");
    valueNode.className = "value";
    valueNode.textContent = value;

    box.append(labelNode, valueNode);
    parent.appendChild(box);
  }

  function showError(message) {
    result.className = "result show error";
    result.replaceChildren();

    const title = document.createElement("div");
    title.className = "big";
    title.textContent = message;

    result.appendChild(title);
  }

  // ================================================
  // 10. 収入を計算
  // ================================================

  form.addEventListener("submit", event => {
    event.preventDefault();

    const baseText =
      document.getElementById("levelBaseIncome").value.trim();

    const baseIncome = Number(baseText);

    const baseUnit =
      document.getElementById("levelBaseUnit").value;

    const level = Number(levelSelect.value);

    const levelMultiplierText =
      levelMultiplierInput.value.trim();

    const levelMultiplier = Number(levelMultiplierText);

    const mutationText =
      document.getElementById("levelMutationMultiplier").value.trim();

    const mutationMultiplier = Number(mutationText);

    const eventText =
      document.getElementById("levelEventMultiplier").value.trim();

    const eventMultiplier = Number(eventText);

    const characterName =
      document.getElementById("levelCharacterName").value.trim();

    if (
      baseText === "" ||
      !Number.isFinite(baseIncome) ||
      baseIncome < 0
    ) {
      showError("基礎収入を確認してください。");
      return;
    }

    if (
      levelMultiplierText === "" ||
      !Number.isFinite(levelMultiplier) ||
      levelMultiplier <= 0
    ) {
      showError("レベル倍率を確認してください。");
      return;
    }

    if (
      mutationText === "" ||
      !Number.isFinite(mutationMultiplier) ||
      mutationMultiplier <= 0 ||
      eventText === "" ||
      !Number.isFinite(eventMultiplier) ||
      eventMultiplier <= 0
    ) {
      showError("変異・イベント倍率を確認してください。");
      return;
    }

    const baseValue =
      baseIncome * Math.pow(1000, unitPower[baseUnit] ?? 0);

    const totalMultiplier =
      levelMultiplier *
      mutationMultiplier *
      eventMultiplier;

    const finalIncome = baseValue * totalMultiplier;

    if (!Number.isFinite(finalIncome)) {
      showError("計算範囲を超えています。入力値を確認してください。");
      return;
    }

    result.className = "result show";
    result.replaceChildren();

    const title = document.createElement("div");

    title.className = "big";
    title.textContent =
      "計算結果：" + formatIncome(finalIncome);

    result.appendChild(title);

    if (characterName) {
      const name = document.createElement("p");

      name.textContent = "キャラクター：" + characterName;
      result.appendChild(name);
    }

    const grid = document.createElement("div");
    grid.className = "level-income-result-grid";

    addResultItem(
      grid,
      "レベル",
      String(level),
      false
    );

    addResultItem(
      grid,
      "レベル倍率",
      formatMultiplier(levelMultiplier) + " 倍",
      false
    );

    addResultItem(
      grid,
      "変異倍率",
      formatMultiplier(mutationMultiplier) + " 倍",
      false
    );

    addResultItem(
      grid,
      "イベント・その他倍率",
      formatMultiplier(eventMultiplier) + " 倍",
      false
    );

    addResultItem(
      grid,
      "合計倍率",
      formatMultiplier(totalMultiplier) + " 倍",
      false
    );

    addResultItem(
      grid,
      "基礎収入",
      baseIncome.toLocaleString("ja-JP") +
        (baseUnit === "1"
          ? "/s"
          : " " + baseUnit + "/s"),
      false
    );

    addResultItem(
      grid,
      "最終的な毎秒の収入",
      formatIncome(finalIncome),
      true
    );

    result.appendChild(grid);

    const note = document.createElement("p");
    note.className = "hint";

    if (ESTIMATED_LEVELS.has(level)) {
      note.textContent =
        "注意：このレベルは補間した推定倍率を使用しています。" +
        "正確な倍率が分かったら、倍率欄を修正して再計算してください。";
    } else {
      note.textContent =
        "確認済み倍率を基準に計算しました。" +
        "変異・イベント倍率は入力された値を使用しています。";
    }

    result.appendChild(note);
  });

  // ================================================
  // 11. リセット
  // ================================================

  form.addEventListener("reset", () => {
    setTimeout(() => {
      characterSelect.value = "";
      levelSelect.value = "1";
      result.className = "result";
      result.replaceChildren();
      updateLevelMultiplier(true);
    }, 0);
  });

  // ================================================
  // 12. レベル倍率の一覧
  // ================================================

  const multiplierList =
    document.getElementById("levelMultiplierList");

  for (let level = 1; level <= 400; level++) {
    const item = document.createElement("div");
    item.className = "level-income-entry";

    const levelLabel = document.createElement("span");
    levelLabel.textContent = "レベル " + level;

    const multiplierLabel = document.createElement("strong");
    multiplierLabel.textContent =
      formatMultiplier(LEVEL_MULTIPLIERS[level]) + " 倍";

    const stateLabel = document.createElement("span");
    stateLabel.className = "hint";
    stateLabel.textContent = ESTIMATED_LEVELS.has(level)
      ? "推定値"
      : "実測データ";

    item.append(levelLabel, multiplierLabel, stateLabel);
    multiplierList.appendChild(item);
  }

  updateLevelMultiplier(true);

  console.log(
    "GOUP レベル収入計算機を追加しました。",
    "レベル数：400",
    "実測倍率：" +
      Object.keys(MEASURED_LEVEL_MULTIPLIERS).length,
    "推定倍率：" + ESTIMATED_LEVELS.size,
    "キャラクター数：" + CHARACTERS.length
  );

})();
</script>
