<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10121b">

<title>GOUP Calculator</title>

<style>
:root {
  color-scheme: dark;
  --bg: #10121b;
  --panel: #191c29;
  --text: #f4f5fb;
  --muted: #a7aec4;
  --accent: #8b7cff;
  --accent2: #5ce1c0;
  --datetime: #c1d7a2;
  --border: #30364d;
  --danger: #ff8585;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(
    ellipse at top,
    #242444,
    var(--bg) 55%
  );
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

header {
  padding: 28px 16px 18px;
  text-align: center;
}

.logo {
  font-size: clamp(1.8rem, 5vw, 2.7rem);
  font-weight: 850;
}

.logo span {
  color: var(--accent2);
}

header p,
.description,
.hint {
  color: var(--muted);
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 0 12px 22px;
}

button {
  cursor: pointer;
  font: inherit;
  font-weight: 700;
}

nav button,
.btn {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 15px;
  background: #202437;
  color: var(--text);
  transition:
    background 0.2s,
    transform 0.2s;
}

nav button:hover,
.btn:hover {
  transform: translateY(-1px);
}

nav button.active,
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

main {
  width: min(880px, calc(100% - 28px));
  margin: 0 auto 42px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {
  background: rgba(25, 28, 41, 0.96);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: clamp(18px, 4vw, 28px);
  margin-bottom: 16px;
  box-shadow: 0 14px 35px #0002;
}

h1 {
  font-size: 1.55rem;
  line-height: 1.3;
}

h2 {
  font-size: 1.2rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

label {
  font-weight: 700;
  font-size: 0.93rem;
}

input,
select {
  width: 100%;
  min-width: 0;
  padding: 12px 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #101321;
  color: var(--text);
  font: inherit;
}

input:focus,
select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.hint {
  font-size: 0.82rem;
  margin: 0;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.result {
  display: none;
  margin-top: 18px;
  padding: 17px;
  border-radius: 14px;
  background: #111625;
  border: 1px solid var(--border);
  overflow-wrap: anywhere;
}

.result.show {
  display: block;
}

.result .big {
  font-size: 1.7rem;
  font-weight: 850;
  color: var(--accent2);
  line-height: 1.5;
}

.result .result-datetime {
  font-size: 1.7rem;
  color: #c1d7a2;
  font-weight: 850;
  line-height: 1.5;
  margin-top: 8px;
}

.result.error .big {
  color: var(--danger);
  font-size: 1.1rem;
}

.tiles {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 18px;
}

.tile {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: #ffffff05;
}

.tile strong {
  display: block;
  font-size: 1.1rem;
}

.tile span {
  color: var(--muted);
  font-size: 0.9rem;
}

.notice {
  border-left: 3px solid var(--accent2);
  padding: 10px 13px;
  background: #5ce1c00d;
  border-radius: 0 10px 10px 0;
  color: var(--muted);
  font-size: 0.9rem;
  margin-top: 18px;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  padding: 10px 18px 28px;
}

@media (max-width: 560px) {
  .grid {
    grid-template-columns: 1fr;
  }

  nav button {
    flex: 1 1 40%;
  }

  .card {
    border-radius: 16px;
  }

  .result .result-datetime {
    font-size: 1.7rem;
    overflow-wrap: anywhere;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">GOUP <span>Calculator</span></div>
  <p>ゲーム内のお金が貯まる時間を計算</p>
</header>

<nav aria-label="メニュー">
  <button class="active" data-page="home">ホーム</button>
  <button data-page="saving">貯金時間計算</button>
</nav>

<main>

  <!-- ホーム -->
  <section id="home" class="page active">
    <div class="card">
      <h1>GOUP Calculatorへようこそ！</h1>

      <p class="description">
        ゲーム内のお金を目標金額まで貯めるために、
        必要な時間と到達予定日時を計算できます。
      </p>

      <div class="tiles">
        <div class="tile">
          <strong>💰 貯金時間計算</strong>
          <span>
            増加速度・所持金・目標金額から、
            必要時間と到達予定日時を計算します。
          </span>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" data-goto="saving">
          貯金時間を計算
        </button>
      </div>
    </div>
  </section>

  <!-- 貯金時間計算 -->
  <section id="saving" class="page">
    <div class="card">
      <h1>💰 貯金時間計算</h1>

      <p class="description">
        増加速度・現在の所持金・目標金額を入力してください。
        所持金を空欄にすると、0から計算します。
      </p>

      <form id="savingForm">
        <div class="grid">

          <div class="field">
            <label for="rate">増加速度（毎秒）</label>

            <input
              id="rate"
              type="number"
              min="0"
              step="any"
              placeholder="例：1"
              required
            >

            <p class="hint">
              例：1 Sx/sなら「1」
            </p>
          </div>

          <div class="field">
            <label for="rateUnit">増加速度の単位</label>

            <select id="rateUnit">
              <option value="Sx">Sx/s</option>
              <option value="Sp">Sp/s</option>
              <option value="Oc">Oc/s</option>
              <option value="Qi">Qi/s</option>
              <option value="No">No/s</option>
              <option value="1">通常の数値/s</option>
            </select>
          </div>

          <div class="field">
            <label for="held">現在の所持金</label>

            <input
              id="held"
              type="number"
              min="0"
              step="any"
              placeholder="例：1"
            >

            <p class="hint">
              空欄の場合は0として計算します。
            </p>
          </div>

          <div class="field">
            <label for="heldUnit">所持金の単位</label>

            <select id="heldUnit">
              <option value="Sp" selected>Sp</option>
              <option value="Sx">Sx</option>
              <option value="Oc">Oc</option>
              <option value="Qi">Qi</option>
              <option value="No">No</option>
              <option value="1">通常の数値</option>
            </select>
          </div>

          <div class="field">
            <label for="goal">目標金額</label>

            <input
              id="goal"
              type="number"
              min="0"
              step="any"
              placeholder="例：10"
              required
            >

            <p class="hint">
              例：10 Ocを目標にするなら「10」
            </p>
          </div>

          <div class="field">
            <label for="goalUnit">目標金額の単位</label>

            <select id="goalUnit">
              <option value="Oc" selected>Oc</option>
              <option value="Sx">Sx</option>
              <option value="Sp">Sp</option>
              <option value="Qi">Qi</option>
              <option value="No">No</option>
              <option value="1">通常の数値</option>
            </select>
          </div>

        </div>

        <div class="actions">
          <button class="btn primary" type="submit">
            計算する
          </button>

          <button class="btn" type="reset">
            リセット
          </button>
        </div>
      </form>

      <div
        id="savingResult"
        class="result"
        aria-live="polite"
      ></div>
    </div>
  </section>

</main>

<footer>
  GOUP Calculator
</footer>

<script>
/* =========================
   ページ切り替え
========================= */

const pages = [...document.querySelectorAll(".page")];

function showPage(id) {
  pages.forEach(page => {
    page.classList.toggle("active", page.id === id);
  });

  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === id
    );
  });

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.page);
  });
});

document.querySelectorAll("[data-goto]").forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.goto);
  });
});


/* =========================
   単位変換
   既存コードの単位換算ルールを維持
========================= */

const UNIT_POWER = {
  "1": 0,
  "Sx": 1,
  "Sp": 2,
  "Oc": 3,
  "Qi": 4,
  "No": 5
};

function toBase(value, unit) {
  return value * Math.pow(1000, UNIT_POWER[unit] ?? 0);
}


/* =========================
   所要時間の表示
========================= */

function formatDuration(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) {
    return "計算できません";
  }

  let remaining = Math.ceil(seconds);

  const days = Math.floor(remaining / 86400);
  remaining %= 86400;

  const hours = Math.floor(remaining / 3600);
  remaining %= 3600;

  const minutes = Math.floor(remaining / 60);
  const secs = remaining % 60;

  const parts = [];

  if (days > 0) {
    parts.push(days + "日");
  }

  if (hours > 0) {
    parts.push(hours + "時間");
  }

  if (minutes > 0) {
    parts.push(minutes + "分");
  }

  if (secs > 0 || parts.length === 0) {
    parts.push(secs + "秒");
  }

  return parts.join(" ");
}


/* =========================
   日本時間の到達予定日時
========================= */

function formatJapanDateTime(date) {
  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(date);

  const values = {};

  for (const part of parts) {
    if (part.type !== "literal") {
      values[part.type] = part.value;
    }
  }

  return (
    Number(values.month) + "月" +
    Number(values.day) + "日" +
    Number(values.hour) + "時" +
    Number(values.minute) + "分"
  );
}


/* =========================
   貯金時間計算
========================= */

const savingForm = document.getElementById("savingForm");
const savingResult = document.getElementById("savingResult");

savingForm.addEventListener("submit", event => {
  event.preventDefault();

  const rate = Number(
    document.getElementById("rate").value
  );

  const rateUnit =
    document.getElementById("rateUnit").value;

  const heldInput =
    document.getElementById("held").value.trim();

  const held = heldInput === ""
    ? 0
    : Number(heldInput);

  const heldUnit =
    document.getElementById("heldUnit").value;

  const goal = Number(
    document.getElementById("goal").value
  );

  const goalUnit =
    document.getElementById("goalUnit").value;

  savingResult.className = "result show";

  /* 入力チェック */
  if (
    !Number.isFinite(rate) ||
    rate <= 0 ||
    !Number.isFinite(held) ||
    held < 0 ||
    !Number.isFinite(goal) ||
    goal < 0
  ) {
    savingResult.classList.add("error");

    savingResult.innerHTML = `
      <div class="big">入力を確認してください</div>
      <p>
        増加速度は0より大きく、
        所持金と目標金額は0以上で入力してください。
      </p>
    `;

    return;
  }

  /* 現在の所持金と目標金額を共通単位に変換 */
  const heldBase = toBase(held, heldUnit);
  const goalBase = toBase(goal, goalUnit);

  const remaining = goalBase - heldBase;

  /* すでに目標達成している場合 */
  if (remaining <= 0) {
    savingResult.innerHTML = `
      <div class="big">目標達成済み！</div>
      <p>
        現在の所持金が目標金額以上です。
      </p>
    `;

    return;
  }

  /* 増加速度を共通単位に変換 */
  const baseRate = toBase(rate, rateUnit);

  /* 必要な秒数 */
  const seconds = remaining / baseRate;

  if (
    !Number.isFinite(seconds) ||
    seconds < 0
  ) {
    savingResult.classList.add("error");

    savingResult.innerHTML = `
      <div class="big">計算できません</div>
      <p>
        入力した数値が大きすぎる可能性があります。
        数値を確認してください。
      </p>
    `;

    return;
  }

  /*
    現在時刻から必要秒数後の日時を計算。
    表示は日本時間（Asia/Tokyo）に統一する。
  */
  const now = Date.now();
  const arrivalTimestamp = now + Math.ceil(seconds) * 1000;

  if (!Number.isFinite(arrivalTimestamp)) {
    savingResult.classList.add("error");

    savingResult.innerHTML = `
      <div class="big">日時を計算できません</div>
      <p>入力した数値を確認してください。</p>
    `;

    return;
  }

  const arrivalDate = new Date(arrivalTimestamp);

  /* 目標単位で残り金額を表示 */
  const remainingInGoalUnit =
    remaining / Math.pow(
      1000,
      UNIT_POWER[goalUnit] ?? 0
    );

  const formattedRemaining =
    remainingInGoalUnit.toLocaleString("ja-JP", {
      maximumFractionDigits: 6
    });

  const formattedDuration = formatDuration(seconds);
  const formattedDateTime = formatJapanDateTime(arrivalDate);

  /* 結果表示 */
  savingResult.innerHTML = `
    <div>目標までに必要な時間</div>

    <div class="big">
      ${formattedDuration}
    </div>

    <div>到達予定日時</div>

    <div class="result-datetime">
      ${formattedDateTime}
    </div>

    <p>
      あと ${formattedRemaining} ${goalUnit} 必要です。
    </p>

    <p class="hint">
      日本時間（JST）で表示しています。
    </p>
  `;
});


/* =========================
   リセット処理
========================= */

savingForm.addEventListener("reset", () => {
  setTimeout(() => {
    /*
      リセット後も所持金の単位はSp、
      目標金額の単位はOcにする。
    */
    document.getElementById("heldUnit").value = "Sp";
    document.getElementById("goalUnit").value = "Oc";
    document.getElementById("rateUnit").value = "Sx";

    savingResult.className = "result";
    savingResult.innerHTML = "";
  }, 0);
});
</script>

</body>
</html>
