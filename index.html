<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10121b">
<title>GOUP Calculator</title>

<style>
:root {
  color-scheme: dark;
  --bg: #10121b;
  --text: #f4f5fb;
  --muted: #a7aec4;
  --accent: #8b7cff;
  --accent2: #5ce1c0;
  --datetime: #c1d7a2;
  --border: #30364d;
  --danger: #ff8585;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(ellipse at top, #242444, var(--bg) 55%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

header {
  padding: 28px 16px 18px;
  text-align: center;
}

.logo {
  font-size: clamp(1.8rem, 5vw, 2.7rem);
  font-weight: 850;
}

.logo span {
  color: var(--accent2);
}

header p,
.description,
.hint {
  color: var(--muted);
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 0 12px 22px;
}

button {
  cursor: pointer;
  font: inherit;
  font-weight: 700;
}

nav button,
.btn {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 15px;
  background: #202437;
  color: var(--text);
  transition: background 0.2s, transform 0.2s;
}

nav button:hover,
.btn:hover {
  transform: translateY(-1px);
}

nav button.active,
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

main {
  width: min(880px, calc(100% - 28px));
  margin: 0 auto 42px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {
  background: rgba(25, 28, 41, 0.96);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: clamp(18px, 4vw, 28px);
  margin-bottom: 16px;
  box-shadow: 0 14px 35px #0002;
}

h1 {
  font-size: 1.55rem;
  line-height: 1.3;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

label {
  font-weight: 700;
  font-size: 0.93rem;
}

input,
select {
  width: 100%;
  min-width: 0;
  padding: 12px 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #101321;
  color: var(--text);
  font: inherit;
}

input:focus,
select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.hint {
  font-size: 0.82rem;
  margin: 0;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.result {
  display: none;
  margin-top: 18px;
  padding: 17px;
  border-radius: 14px;
  background: #111625;
  border: 1px solid var(--border);
  overflow-wrap: anywhere;
}

.result.show {
  display: block;
}

.result .big {
  font-size: 1.7rem;
  font-weight: 850;
  color: var(--accent2);
  line-height: 1.5;
}

.result .result-datetime {
  font-size: 1.7rem;
  color: #c1d7a2;
  font-weight: 850;
  line-height: 1.5;
  margin-top: 8px;
}

.result .current-time {
  font-size: 1.1rem;
  color: var(--muted);
  font-weight: 700;
  margin-top: 6px;
  line-height: 1.5;
}

.result.error .big {
  color: var(--danger);
  font-size: 1.1rem;
}

.tiles {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 18px;
}

.tile {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: #ffffff05;
}

.tile strong {
  display: block;
  font-size: 1.1rem;
}

.tile span {
  color: var(--muted);
  font-size: 0.9rem;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  padding: 10px 18px 28px;
}

@media (max-width: 560px) {
  .grid {
    grid-template-columns: 1fr;
  }

  nav button {
    flex: 1 1 40%;
  }

  .card {
    border-radius: 16px;
  }

  .result .result-datetime {
    font-size: 1.7rem;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">GOUP <span>Calculator</span></div>
  <p>ゲーム内のお金が貯まる時間を計算</p>
</header>

<nav aria-label="メニュー">
  <button class="active" data-page="home" type="button">ホーム</button>
  <button data-page="saving" type="button">貯金時間計算</button>
</nav>

<main>

<section id="home" class="page active">
  <div class="card">
    <h1>GOUP Calculatorへようこそ！</h1>

    <p class="description">
      ゲーム内のお金を目標金額まで貯めるために、
      必要な時間と到達予定日時を計算できます。
    </p>

    <div class="tiles">
      <div class="tile">
        <strong>💰 貯金時間計算</strong>
        <span>
          増加速度・所持金・目標金額から、
          必要時間と到達予定日時を計算します。
        </span>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" data-goto="saving" type="button">
        貯金時間を計算
      </button>
    </div>
  </div>
</section>

<section id="saving" class="page">
  <div class="card">
    <h1>💰 貯金時間計算</h1>

    <p class="description">
      増加速度・現在の所持金・目標金額を入力してください。
      所持金を空欄にすると、0から計算します。
    </p>

    <form id="savingForm" novalidate>
      <div class="grid">

        <div class="field">
          <label for="rate">増加速度（毎秒）</label>
          <input
            id="rate"
            type="number"
            min="0"
            step="any"
            placeholder="例：1"
          >
          <p class="hint">例：1 Sx/sなら「1」</p>
        </div>

        <div class="field">
          <label for="rateUnit">増加速度の単位</label>
          <select id="rateUnit">
            <option value="Sx">Sx/s</option>
            <option value="Sp">Sp/s</option>
            <option value="Oc">Oc/s</option>
            <option value="Qi">Qi/s</option>
            <option value="No">No/s</option>
            <option value="1">通常の数値/s</option>
          </select>
        </div>

        <div class="field">
          <label for="held">現在の所持金</label>
          <input
            id="held"
            type="number"
            min="0"
            step="any"
            placeholder="例：1"
          >
          <p class="hint">空欄の場合は0として計算します。</p>
        </div>

        <div class="field">
          <label for="heldUnit">所持金の単位</label>
          <select id="heldUnit">
            <option value="Sp" selected>Sp</option>
            <option value="Sx">Sx</option>
            <option value="Oc">Oc</option>
            <option value="Qi">Qi</option>
            <option value="No">No</option>
            <option value="1">通常の数値</option>
          </select>
        </div>

        <div class="field">
          <label for="goal">目標金額</label>
          <input
            id="goal"
            type="number"
            min="0"
            step="any"
            placeholder="例：10"
          >
          <p class="hint">例：10 Ocを目標にするなら「10」</p>
        </div>

        <div class="field">
          <label for="goalUnit">目標金額の単位</label>
          <select id="goalUnit">
            <option value="Oc" selected>Oc</option>
            <option value="Sx">Sx</option>
            <option value="Sp">Sp</option>
            <option value="Qi">Qi</option>
            <option value="No">No</option>
            <option value="1">通常の数値</option>
          </select>
        </div>

      </div>

      <div class="actions">
        <button class="btn primary" type="submit">計算する</button>
        <button class="btn" type="reset">リセット</button>
      </div>
    </form>

    <div id="savingResult" class="result" aria-live="polite"></div>
  </div>
</section>

</main>

<footer>GOUP Calculator</footer>

<script>
"use strict";

/* ページ切り替え */
const pages = [...document.querySelectorAll(".page")];

function showPage(id) {
  pages.forEach(page => {
    page.classList.toggle("active", page.id === id);
  });

  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle("active", button.dataset.page === id);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.page);
  });
});

document.querySelectorAll("[data-goto]").forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.goto);
  });
});


/* 単位変換 */
const UNIT_POWER = {
  "1": 0,
  Sx: 1,
  Sp: 2,
  Oc: 3,
  Qi: 4,
  No: 5
};

function toBase(value, unit) {
  return value * Math.pow(1000, UNIT_POWER[unit] ?? 0);
}


/* 所要時間 */
function formatDuration(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) {
    return "計算できません";
  }

  let remaining = Math.ceil(seconds);

  const days = Math.floor(remaining / 86400);
  remaining %= 86400;

  const hours = Math.floor(remaining / 3600);
  remaining %= 3600;

  const minutes = Math.floor(remaining / 60);
  const secs = remaining % 60;

  const parts = [];

  if (days) parts.push(days + "日");
  if (hours) parts.push(hours + "時間");
  if (minutes) parts.push(minutes + "分");

  if (secs || parts.length === 0) {
    parts.push(secs + "秒");
  }

  return parts.join(" ");
}


/* 日本時間の日時を取得 */
function getJapanDateParts(date) {
  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(date);

  const values = {};

  for (const part of parts) {
    if (part.type !== "literal") {
      values[part.type] = Number(part.value);
    }
  }

  return values;
}


/* 現在時刻の表示 */
function formatJapanClockTime(date) {
  const parts = getJapanDateParts(date);

  return (
    String(parts.hour).padStart(2, "0") +
    "時" +
    String(parts.minute).padStart(2, "0") +
    "分"
  );
}


/* 到達予定日時
   今日なら時刻だけ、別の日なら月日も表示 */
function formatJapanArrivalDateTime(arrivalDate, now) {
  const arrival = getJapanDateParts(arrivalDate);
  const current = getJapanDateParts(now);

  const sameDay =
    arrival.year === current.year &&
    arrival.month === current.month &&
    arrival.day === current.day;

  const time =
    String(arrival.hour).padStart(2, "0") +
    "時" +
    String(arrival.minute).padStart(2, "0") +
    "分";

  if (sameDay) {
    return time;
  }

  return arrival.month + "月" + arrival.day + "日" + time;
}


/* エラー表示 */
const savingForm = document.getElementById("savingForm");
const savingResult = document.getElementById("savingResult");

function showError(message) {
  savingResult.className = "result show error";
  savingResult.replaceChildren();

  const title = document.createElement("div");
  title.className = "big";
  title.textContent = message;

  const detail = document.createElement("p");
  detail.textContent = "入力内容を確認して、もう一度計算してください。";

  savingResult.append(title, detail);
}


/* 貯金時間計算 */
savingForm.addEventListener("submit", event => {
  event.preventDefault();

  savingResult.className = "result show";

  const rateText = document.getElementById("rate").value.trim();
  const heldText = document.getElementById("held").value.trim();
  const goalText = document.getElementById("goal").value.trim();

  const rate = Number(rateText);
  const rateUnit = document.getElementById("rateUnit").value;

  const held = heldText === "" ? 0 : Number(heldText);
  const heldUnit = document.getElementById("heldUnit").value;

  const goal = Number(goalText);
  const goalUnit = document.getElementById("goalUnit").value;

  /* 入力チェック。必須項目が空でも結果欄にエラーを表示する */
  if (
    rateText === "" ||
    goalText === "" ||
    !Number.isFinite(rate) ||
    rate <= 0 ||
    !Number.isFinite(held) ||
    held < 0 ||
    !Number.isFinite(goal) ||
    goal < 0
  ) {
    showError("入力を確認してください");
    return;
  }

  const heldBase = toBase(held, heldUnit);
  const goalBase = toBase(goal, goalUnit);
  const remaining = goalBase - heldBase;

  if (!Number.isFinite(remaining)) {
    showError("金額が大きすぎます");
    return;
  }

  /* 目標達成済み */
  if (remaining <= 0) {
    savingResult.className = "result show";
    savingResult.innerHTML =
      "<div class=\"big\">目標達成済み！</div>" +
      "<p>現在の所持金が目標金額以上です。</p>";
    return;
  }

  const baseRate = toBase(rate, rateUnit);
  const seconds = remaining / baseRate;

  if (!Number.isFinite(seconds) || seconds < 0) {
    showError("計算できません");
    return;
  }

  const now = new Date();
  const arrivalTimestamp = now.getTime() + Math.ceil(seconds) * 1000;
  const arrivalDate = new Date(arrivalTimestamp);

  if (
    !Number.isFinite(arrivalTimestamp) ||
    Number.isNaN(arrivalDate.getTime())
  ) {
    showError("日時を計算できません");
    return;
  }

  const remainingInGoalUnit =
    remaining / Math.pow(1000, UNIT_POWER[goalUnit] ?? 0);

  const formattedRemaining =
    remainingInGoalUnit.toLocaleString("ja-JP", {
      maximumFractionDigits: 6
    });

  const duration = formatDuration(seconds);
  const arrival = formatJapanArrivalDateTime(arrivalDate, now);
  const currentTime = formatJapanClockTime(now);

  /* HTMLに入力値を直接埋め込まず、安全に結果表示 */
  savingResult.className = "result show";
  savingResult.replaceChildren();

  function addText(tag, className, text) {
    const element = document.createElement(tag);

    if (className) {
      element.className = className;
    }

    element.textContent = text;
    savingResult.appendChild(element);

    return element;
  }

  addText("div", "", "目標までに必要な時間");
  addText("div", "big", duration);

  addText("div", "", "到達予定日時");
  addText("div", "result-datetime", arrival);

  addText("div", "current-time", "現在時刻：" + currentTime);

  addText(
    "p",
    "",
    `あと ${formattedRemaining} ${goalUnit} 必要です。`
  );

  addText("p", "hint", "日本時間（JST）で表示しています。");
});


/* リセット */
savingForm.addEventListener("reset", () => {
  setTimeout(() => {
    document.getElementById("rateUnit").value = "Sx";
    document.getElementById("heldUnit").value = "Sp";
    document.getElementById("goalUnit").value = "Oc";

    savingResult.className = "result";
    savingResult.replaceChildren();
  }, 0);
});
</script>

</body>
</html>
