<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10111a">
<title>GOUP Calculator</title>

<style>
:root {
  --bg: #10111a;
  --panel: #191e2d;
  --panel2: #20283a;
  --text: #f3f5ff;
  --muted: #a4aec4;
  --accent: #8b9cff;
  --accent2: #b69cff;
  --line: #30394e;
  --green: #7be0b1;
  --red: #ff929c;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 24px;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans JP", sans-serif;
  line-height: 1.6;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.site-sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 248px;
  padding: 24px 16px;
  background: #0c1220;
  border-right: 1px solid var(--line);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 24px;
  overflow-y: auto;
}

.brand {
  color: var(--text);
  text-decoration: none;
  font-size: 1.1rem;
  font-weight: 900;
  line-height: 1.4;
}

.brand span {
  display: block;
  color: var(--accent);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  margin-top: 6px;
}

.nav-label {
  color: var(--muted);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  font-weight: 800;
  margin: 0 0 8px 10px;
}

.site-nav {
  display: grid;
  gap: 7px;
}

.site-nav a {
  color: var(--muted);
  text-decoration: none;
  padding: 12px 13px;
  border-radius: 11px;
  font-weight: 700;
  border: 1px solid transparent;
}

.site-nav a:hover,
.site-nav a.active {
  color: var(--text);
  background: var(--panel2);
  border-color: var(--line);
}

.sidebar-note {
  margin-top: auto;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.7;
}

.main-area {
  margin-left: 248px;
  min-height: 100vh;
  padding: 32px 20px 48px;
}

main {
  max-width: 780px;
  margin: 0 auto;
}

.menu-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 31;
  width: 46px;
  height: 46px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  color: var(--text);
  font-size: 1.35rem;
}

.sidebar-backdrop {
  display: none;
}

.hero {
  padding: 30px;
  margin-bottom: 24px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(135deg, #242d49, #191e2d 70%);
}

.eyebrow {
  color: var(--accent);
  font-size: 0.76rem;
  font-weight: 900;
  letter-spacing: 0.14em;
}

h1 {
  margin: 8px 0 12px;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  line-height: 1.25;
}

h2 {
  margin: 0 0 8px;
  font-size: 1.4rem;
}

h3 {
  margin-top: 0;
}

p {
  color: var(--muted);
}

.section {
  margin: 28px 0;
  padding: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  scroll-margin-top: 20px;
}

.section-intro {
  margin-top: 0;
  margin-bottom: 22px;
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.field {
  min-width: 0;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 700;
}

input,
select {
  width: 100%;
  min-width: 0;
  padding: 12px;
  color: var(--text);
  background: #101522;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
}

input:focus,
select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px #8b9cff22;
}

input::placeholder {
  color: #68748b;
}

.field-help {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 0.78rem;
}

.primary-button,
.secondary-button {
  width: 100%;
  padding: 13px 16px;
  border-radius: 11px;
  font-weight: 900;
  margin-top: 18px;
}

.primary-button {
  color: #10111a;
  background: var(--accent);
  border: 0;
}

.primary-button:hover {
  filter: brightness(1.08);
}

.secondary-button {
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--line);
}

.result {
  margin-top: 20px;
  padding: 18px;
  background: #111827;
  border: 1px solid var(--line);
  border-radius: 13px;
  overflow-wrap: anywhere;
}

.result-title {
  color: var(--muted);
  font-size: 0.84rem;
  font-weight: 700;
}

.result-value {
  color: var(--green);
  font-size: clamp(1.35rem, 4vw, 2rem);
  font-weight: 900;
  margin: 4px 0;
}

.result-detail {
  font-size: 0.9rem;
  color: var(--muted);
  white-space: pre-line;
}

.error {
  color: var(--red);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.stat {
  padding: 14px;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 12px;
  min-width: 0;
}

.stat-label {
  color: var(--muted);
  font-size: 0.8rem;
}

.stat-value {
  font-size: 1.05rem;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.table-wrap {
  overflow-x: auto;
  margin-top: 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 420px;
}

th, td {
  padding: 11px 13px;
  text-align: right;
  border-bottom: 1px solid var(--line);
}

th {
  color: var(--muted);
  background: #111
